name: Comprobar el proyecto

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar pruebas geométricas
        run: npm test
      - name: Revisar formato
        run: npm run format:check
      - name: Compilar el visor
        run: npm run build
